
{% extends "templates/main_temp.html" %}
{% block title %}{{title}}{% endblock %}
{% block content %}
<div class="">
	<div class="p-6 w-full h-fit flex flex-col md:flex-row gap-2 md:gap-8 justify-center">
		<img src={{image}} class="w-fit max-w-[200] md:max-w-[300] aspect[2/3]"/>
		<div>
		  <h1 class="w-fit font-bold text-xl md:text-4xl">{{title}} </h1>
		  <h3> {{author}} - {{publisher}}</h3>
		  <div class="w-full h-fit bg-white rounded-xl flex flex-row">
		     <div class="w-fit h-full flex flex-col text-center bg-white ml-2  p-2 mt-2 border-r-2 border-gray-100">
	     	    <span class="font-bold text-lg">{{pages_completed}}</span>
	     	    <span>of</span>
		        <span class="text-sm">{{total_no_of_pages}} pages</span>
		     </div>
		     <div class="w-fit h-full flex flex-col text-center bg-white ml-2  p-2 mt-2 border-r-2 border-gray-100">
	     	    <span class="font-bold text-lg">{{percent}}</span>
	     	    <span>of</span>
		        <span class="text-sm">{{total_no_of_pages}} pages</span>
		     </div>
		     <div class="flex w-fit bg-[--bg]">
		     </div>
		  </div>
		</div>
	</div>
</div>
{% endblock %}
<!-- this is a sample default web page template -->
